[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outlook-sidecar"
version = "0.1.0"
description = "Generate on-call summaries from local Outlook emails"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Operations Team"}]
dependencies = [
    "pywin32; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
outlook-sidecar = "outlook_sidecar.cli:main"
outlook-sidecar-gui = "outlook_sidecar.gui:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
